name: CI

# Android is the only target (docs/ROADMAP.md), so there is one build job and it
# runs on ubuntu-latest: no macOS minutes, which a private repo bills at 10x.
# No path filters, so required status checks never hang.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # The generated lib/l10n/app_localizations*.dart files are committed;
      # they must match the ARB files (LANG-2).
      - name: Check generated localizations
        if: hashFiles('l10n.yaml') != ''
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

      # GitHub Pages publishes every file in docs/, on the domain the store listing
      # points at. This fails when a doc is neither excluded nor declared public.
      - name: Check what GitHub Pages would publish
        if: ${{ !cancelled() }}
        run: bash scripts/check_public_docs.sh

      # The rule IDs are the spine of the method and nothing else checks them. An
      # ID cited but defined nowhere is a typo or a renumbering, and fails; a rule
      # nothing cites is reported in the summary without failing, because it may
      # simply not be built yet.
      - name: Check the product rules
        if: ${{ !cancelled() }}
        run: bash scripts/rules.sh

      # A PR ships a release or it does not; the developer decides. Leaving the
      # version alone passes. Raising it means release.yml will treat the merge
      # as a release, so it has to bring a CHANGELOG.md entry and a build number
      # that moves with it. Lowering it always fails.
      # Dependabot PRs never bump; they ship with the next release.
      - name: Check the version, if this PR moves it
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: bash scripts/version.sh check

  # The Android job, and the Kotlin half of capture rides inside it.
  #
  # `flutter test` never compiles or runs a line of Kotlin, so without these tests
  # CAP-1's fail-closed store and CAP-15's 30-day queue sweep -- both of which
  # docs/privacy-policy.md makes a claim about -- ship on nothing but review.
  #
  # They used to be a job of their own, on the reasoning that a ruleset can require
  # a job and cannot require a step. True, and beside the point: the `main` ruleset
  # requires exactly `Format, analyze, test` and `Android build (debug)`, so a job
  # named anything else was never required and every Kotlin test could go red with
  # the pull request still mergeable. A gate that needs a GitHub setting changed
  # before it gates anything is not a gate. Folded in here it is required today, by
  # a check that is already on the list.
  #
  # `name:` is therefore load-bearing and must stay byte for byte `Android build
  # (debug)`: the ruleset matches the check by that string, and renaming the job to
  # mention the tests would leave the required check waiting for a name nothing
  # reports (docs/ROADMAP.md, Phase 0, the ruleset item).
  android:
    name: Android build (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # android/gradlew and local.properties are both gitignored -- the wrapper
      # script because Flutter injects it, local.properties because it holds
      # absolute paths -- so neither exists after a checkout, and
      # settings.gradle.kts reads flutter.sdk out of local.properties before it can
      # configure anything. --config-only writes both and returns without
      # assembling an artifact, so the unit tests below can run before the build.
      - name: Generate the Gradle config
        run: flutter build apk --debug --config-only

      # JVM tests only: CaptureQueue and CaptureStore touch java.io.File and
      # org.json and no framework class, so there is no emulator and no Robolectric.
      # Before the APK build, so a broken rule is reported in a minute rather than
      # after a full build.
      - name: Kotlin unit tests
        run: ./android/gradlew -p android :app:testDebugUnitTest

      # `!cancelled()`, so a red Kotlin test does not hide a build that is also
      # broken: one run reports both.
      - name: Build APK
        if: ${{ !cancelled() }}
        run: flutter build apk --debug
